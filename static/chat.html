<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IFS Corporate AI Chat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #101622;
            --panel: #182235;
            --panel-2: #21314d;
            --border: #2c4167;
            --accent: #ff6a3d;
            --accent-soft: rgba(255, 106, 61, 0.12);
            --text: #eef3ff;
            --muted: #8fa3c5;
            --success: #29d17f;
            --danger: #ff6b6b;
        }

        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at top, #1d2940 0%, var(--bg) 52%);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: rgba(16, 22, 34, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            padding: 16px 24px 12px;
        }

        .topline {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .dot {
            width: 10px;
            height: 10px;
            background: var(--success);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.45; }
        }

        header h1 {
            font-size: 18px;
            font-weight: 700;
            color: var(--accent);
        }

        .sub {
            margin-left: auto;
            color: var(--muted);
            font-size: 12px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-top: 14px;
            align-items: center;
            flex-wrap: wrap;
        }

        .tab {
            border: 1px solid var(--border);
            background: transparent;
            color: var(--muted);
            padding: 10px 14px;
            border-radius: 999px;
            cursor: pointer;
            transition: 0.2s ease;
            font-size: 13px;
            font-weight: 600;
        }

        .tab.active {
            color: var(--text);
            background: var(--accent-soft);
            border-color: rgba(255, 106, 61, 0.45);
        }

        .tab:hover {
            color: var(--text);
            border-color: rgba(255, 106, 61, 0.35);
        }

        .tab-link {
            text-decoration: none;
            display: inline-flex;
            align-items: center;
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .workspace {
            flex: 1;
            display: flex;
            min-height: 0;
        }

        .chat-shell {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }

        .panel-shell {
            width: 360px;
            border-left: 1px solid var(--border);
            background: rgba(16, 22, 34, 0.78);
            backdrop-filter: blur(10px);
            padding: 20px 18px;
            overflow-y: auto;
        }

        .panel-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .panel-title h2 {
            font-size: 15px;
            color: var(--text);
        }

        .panel-actions {
            display: flex;
            gap: 8px;
        }

        .ghost-btn {
            border: 1px solid var(--border);
            background: transparent;
            color: var(--muted);
            border-radius: 10px;
            padding: 8px 10px;
            font-size: 12px;
            cursor: pointer;
        }

        .ghost-btn:hover {
            color: var(--text);
            border-color: rgba(255, 106, 61, 0.45);
        }

        .panel-section {
            margin-bottom: 18px;
            padding: 14px;
            background: rgba(24, 34, 53, 0.72);
            border: 1px solid var(--border);
            border-radius: 14px;
        }

        .panel-section h3 {
            font-size: 12px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 12px;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(143, 163, 197, 0.12);
            border-radius: 12px;
            padding: 12px;
        }

        .stat-label {
            font-size: 11px;
            color: var(--muted);
            margin-bottom: 6px;
        }

        .stat-value {
            font-size: 18px;
            font-weight: 700;
            color: var(--text);
        }

        .stat-sub {
            font-size: 11px;
            color: var(--muted);
            margin-top: 4px;
        }

        .engine-row, .recent-row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 8px 0;
            border-bottom: 1px solid rgba(143, 163, 197, 0.12);
            font-size: 13px;
        }

        .engine-row:last-child, .recent-row:last-child {
            border-bottom: none;
        }

        .engine-meta, .recent-meta {
            color: var(--muted);
            font-size: 12px;
        }

        .budget-bar {
            height: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 999px;
            overflow: hidden;
            margin: 10px 0 6px;
        }

        .budget-fill {
            height: 100%;
            width: 0;
            background: linear-gradient(90deg, #29d17f, #ffcc4d, #ff6b6b);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 9px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge.ok {
            background: rgba(41, 209, 127, 0.14);
            color: #8ef0b8;
        }

        .badge.warn {
            background: rgba(255, 204, 77, 0.12);
            color: #ffd975;
        }

        .badge.off {
            background: rgba(143, 163, 197, 0.12);
            color: #c6d4ec;
        }

        .mono {
            font-family: Consolas, Monaco, monospace;
            font-size: 12px;
            color: var(--muted);
            word-break: break-all;
        }

        .message {
            max-width: 78%;
            padding: 12px 16px;
            border-radius: 14px;
            line-height: 1.5;
            font-size: 14px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #355bff, #1f3fa4);
            color: #fff;
            border-bottom-right-radius: 5px;
        }

        .message.assistant {
            align-self: flex-start;
            background: var(--panel);
            border: 1px solid var(--border);
            border-bottom-left-radius: 5px;
        }

        .message.error {
            align-self: flex-start;
            background: rgba(255, 107, 107, 0.14);
            color: #ffd7d7;
            border: 1px solid rgba(255, 107, 107, 0.55);
        }

        .typing {
            align-self: flex-start;
            padding: 12px 16px;
            background: var(--panel);
            border-radius: 14px;
            border: 1px solid var(--border);
            display: none;
        }

        .typing span {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
            margin: 0 2px;
            animation: bounce 1.4s infinite ease-in-out;
        }

        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        #input-area {
            padding: 16px 24px;
            background: rgba(16, 22, 34, 0.92);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 12px;
        }

        #user-input {
            flex: 1;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            padding: 12px;
            font-size: 14px;
            font-family: inherit;
            resize: none;
            outline: none;
            min-height: 44px;
            max-height: 120px;
        }

        #user-input:focus {
            border-color: rgba(255, 106, 61, 0.55);
        }

        #send-btn {
            background: linear-gradient(135deg, var(--accent), #ff8456);
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 0 24px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }

        #send-btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .hint {
            color: var(--muted);
            font-size: 12px;
            margin: 0 24px 12px;
        }

        @media (max-width: 1100px) {
            .workspace {
                flex-direction: column;
            }

            .panel-shell {
                width: 100%;
                border-left: none;
                border-top: 1px solid var(--border);
                max-height: 320px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="topline">
            <div class="dot"></div>
            <h1>IFS Corporate AI</h1>
            <span class="sub" id="header-subtitle">LangGraph Supervisor</span>
        </div>
        <div class="tabs">
            <button class="tab active" data-tab="langgraph" onclick="switchTab('langgraph')">LangGraph Chat</button>
            <button class="tab" data-tab="maf" onclick="switchTab('maf')">Microsoft Agent Framework</button>
            <a class="tab tab-link" href="/gateway">Gateway / Portkey</a>
        </div>
    </header>

    <div class="workspace">
        <div class="chat-shell">
            <div id="chat-container"></div>

            <div class="typing" id="typing">
                <span></span><span></span><span></span>
            </div>

            <div class="hint" id="engine-hint">Aktif motor: LangGraph uzman ajanlari</div>

            <div id="input-area">
                <textarea id="user-input" placeholder="Mesajinizi yazin..." rows="1"></textarea>
                <button id="send-btn" onclick="sendMessage()">Gonder</button>
            </div>
        </div>

        <aside class="panel-shell">
            <div class="panel-title">
                <h2>Cost Control Panel</h2>
                <div class="panel-actions">
                    <button class="ghost-btn" onclick="loadControlPanel()">Yenile</button>
                    <button class="ghost-btn" onclick="resetControlPanel()">Sifirla</button>
                </div>
            </div>

            <div class="panel-section">
                <h3>Gateway</h3>
                <div id="gateway-badge" class="badge off">Kapali</div>
                <div class="mono" id="gateway-base" style="margin-top: 10px;">-</div>
                <div class="mono" id="gateway-meta" style="margin-top: 8px;">-</div>
            </div>

            <div class="panel-section">
                <h3>Toplam</h3>
                <div class="stat-grid">
                    <div class="stat-card">
                        <div class="stat-label">Tahmini Maliyet</div>
                        <div class="stat-value" id="total-cost">$0.0000</div>
                        <div class="stat-sub" id="budget-label">Butce kullanimi: 0%</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Toplam Token</div>
                        <div class="stat-value" id="total-tokens">0</div>
                        <div class="stat-sub" id="total-calls">0 LLM cagrisi</div>
                    </div>
                </div>
                <div class="budget-bar">
                    <div class="budget-fill" id="budget-fill"></div>
                </div>
            </div>

            <div class="panel-section">
                <h3>Motorlar</h3>
                <div id="engine-stats"></div>
            </div>

            <div class="panel-section">
                <h3>Modeller</h3>
                <div id="model-stats"></div>
            </div>

            <div class="panel-section">
                <h3>Son Cagrilar</h3>
                <div id="recent-rows"></div>
            </div>
        </aside>
    </div>

    <script>
        const MODELS = {
            langgraph: {
                model: "ifs-agent",
                subtitle: "LangGraph Supervisor",
                hint: "Aktif motor: LangGraph uzman ajanlari",
                welcome: "Merhaba! Ben IFS Corporate AI asistaniyim. Bu sekmede LangGraph tabanli supervisor akisi aktif."
            },
            maf: {
                model: "ifs-microsoft-agent",
                subtitle: "Microsoft Agent Framework",
                hint: "Aktif motor: Microsoft Agent Framework uzman ajanlari",
                welcome: "Merhaba! Ben IFS Corporate AI asistaniyim. Bu sekmede Microsoft Agent Framework tabanli uzman ajan akisi aktif."
            }
        };

        const chatContainer = document.getElementById("chat-container");
        const userInput = document.getElementById("user-input");
        const sendBtn = document.getElementById("send-btn");
        const typingIndicator = document.getElementById("typing");
        const headerSubtitle = document.getElementById("header-subtitle");
        const engineHint = document.getElementById("engine-hint");
        const gatewayBadge = document.getElementById("gateway-badge");
        const gatewayBase = document.getElementById("gateway-base");
        const gatewayMeta = document.getElementById("gateway-meta");
        const totalCost = document.getElementById("total-cost");
        const totalTokens = document.getElementById("total-tokens");
        const totalCalls = document.getElementById("total-calls");
        const budgetLabel = document.getElementById("budget-label");
        const budgetFill = document.getElementById("budget-fill");
        const engineStats = document.getElementById("engine-stats");
        const modelStats = document.getElementById("model-stats");
        const recentRows = document.getElementById("recent-rows");

        let activeTab = "langgraph";
        const conversations = {
            langgraph: [{ role: "assistant", content: MODELS.langgraph.welcome }],
            maf: [{ role: "assistant", content: MODELS.maf.welcome }]
        };

        userInput.addEventListener("input", function () {
            this.style.height = "auto";
            this.style.height = Math.min(this.scrollHeight, 120) + "px";
        });

        userInput.addEventListener("keydown", function (e) {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        function renderConversation() {
            chatContainer.innerHTML = "";
            const messages = conversations[activeTab];
            messages.forEach((item) => addMessage(item.role === "assistant" ? "assistant" : item.role, item.content));
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function addMessage(role, content) {
            const div = document.createElement("div");
            div.className = `message ${role}`;
            div.textContent = content;
            chatContainer.appendChild(div);
        }

        function switchTab(tab) {
            activeTab = tab;
            document.querySelectorAll(".tab").forEach((button) => {
                button.classList.toggle("active", button.dataset.tab === tab);
            });
            headerSubtitle.textContent = MODELS[tab].subtitle;
            engineHint.textContent = MODELS[tab].hint;
            renderConversation();
            userInput.focus();
        }

        function formatUsd(value) {
            const amount = Number(value || 0);
            return `$${amount.toFixed(amount < 0.01 ? 4 : 2)}`;
        }

        function formatInt(value) {
            return new Intl.NumberFormat("tr-TR").format(Number(value || 0));
        }

        function renderRows(container, rows, emptyText) {
            if (!rows.length) {
                container.innerHTML = `<div class="engine-meta">${emptyText}</div>`;
                return;
            }
            container.innerHTML = rows.join("");
        }

        async function loadControlPanel() {
            try {
                const response = await fetch("/api/control-panel");
                if (!response.ok) throw new Error("Panel verisi alinamadi");
                const data = await response.json();

                const gateway = data.gateway || {};
                gatewayBadge.className = `badge ${gateway.enabled ? (gateway.mode === "disabled" ? "off" : "ok") : "off"}`;
                gatewayBadge.textContent = gateway.enabled
                    ? `Portkey ${gateway.mode}`
                    : "Gateway kapali";
                gatewayBase.textContent = gateway.base_url || "-";
                gatewayMeta.textContent = gateway.enabled
                    ? `provider=${gateway.provider || "-"}${gateway.model_prefix ? ` | prefix=${gateway.model_prefix}` : ""}`
                    : "Dogrudan provider baglantisi";

                const totals = data.totals || {};
                const budget = data.budget || {};
                totalCost.textContent = formatUsd(totals.estimated_cost_usd);
                totalTokens.textContent = formatInt(totals.total_tokens);
                totalCalls.textContent = `${formatInt(totals.llm_calls)} LLM cagrisi`;
                budgetLabel.textContent = `Butce kullanimi: ${budget.used_percent || 0}% | Soft limit ${formatUsd(budget.soft_limit_usd)}`;
                budgetFill.style.width = `${Math.min(Number(budget.used_percent || 0), 100)}%`;

                const engineRows = Object.entries(data.engines || {}).map(([name, item]) => `
                    <div class="engine-row">
                        <div>
                            <div>${name === "maf" ? "Microsoft Agent Framework" : "LangGraph"}</div>
                            <div class="engine-meta">${formatInt(item.requests)} istek | ${formatInt(item.llm_calls)} LLM cagrisi</div>
                        </div>
                        <div style="text-align:right">
                            <div>${formatUsd(item.estimated_cost_usd)}</div>
                            <div class="engine-meta">${formatInt(item.total_tokens)} token</div>
                        </div>
                    </div>
                `);
                renderRows(engineStats, engineRows, "Henuz kayit yok.");

                const modelRows = Object.entries(data.models || {}).map(([name, item]) => `
                    <div class="engine-row">
                        <div>
                            <div>${name}</div>
                            <div class="engine-meta">${formatInt(item.llm_calls)} cagri</div>
                        </div>
                        <div style="text-align:right">
                            <div>${formatUsd(item.estimated_cost_usd)}</div>
                            <div class="engine-meta">${formatInt(item.total_tokens)} token</div>
                        </div>
                    </div>
                `);
                renderRows(modelStats, modelRows, "Henuz model verisi yok.");

                const recent = (data.recent || []).slice(0, 8).map((item) => `
                    <div class="recent-row">
                        <div>
                            <div>${item.engine} / ${item.component}</div>
                            <div class="recent-meta">${item.model_id}</div>
                        </div>
                        <div style="text-align:right">
                            <div>${formatUsd(item.estimated_cost_usd)}</div>
                            <div class="recent-meta">${formatInt(item.total_tokens)} token</div>
                        </div>
                    </div>
                `);
                renderRows(recentRows, recent, "Henuz LLM cagrisi yok.");
            } catch (err) {
                gatewayBadge.className = "badge warn";
                gatewayBadge.textContent = "Panel hatasi";
                gatewayBase.textContent = err.message;
            }
        }

        async function resetControlPanel() {
            const confirmed = window.confirm("Maliyet panelini sifirlamak istiyor musunuz?");
            if (!confirmed) return;
            await fetch("/api/control-panel/reset", { method: "POST" });
            await loadControlPanel();
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            const history = conversations[activeTab];
            history.push({ role: "user", content: text });
            renderConversation();

            userInput.value = "";
            userInput.style.height = "auto";
            sendBtn.disabled = true;
            typingIndicator.style.display = "block";
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const response = await fetch("/v1/chat/completions", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        model: MODELS[activeTab].model,
                        messages: history,
                        stream: false
                    })
                });

                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.detail || response.statusText);
                }

                const data = await response.json();
                const assistantMsg = data.choices[0].message.content;
                history.push({ role: "assistant", content: assistantMsg });
                renderConversation();
                await loadControlPanel();

            } catch (err) {
                history.push({ role: "error", content: "Hata: " + err.message });
                renderConversation();
            } finally {
                typingIndicator.style.display = "none";
                sendBtn.disabled = false;
                userInput.focus();
            }
        }

        renderConversation();
        loadControlPanel();
        setInterval(loadControlPanel, 12000);
        userInput.focus();
    </script>
</body>
</html>
